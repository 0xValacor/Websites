<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transmissions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05010c;
    --ink: #ece9ff;
    --muted: #7d78a8;
    --line: rgba(25, 240, 255, 0.16);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-weight: 300;
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 10vh 24px;
  }

  .works { list-style: none; border-top: 1px solid var(--line); }

  .work { border-bottom: 1px solid var(--line); }

  .work a {
    display: grid;
    grid-template-columns: 4.5rem 1fr;
    align-items: center;
    gap: 1.5rem;
    padding: 2.4rem 0;
    color: inherit;
    text-decoration: none;
  }
  .work a:focus-visible { outline: 1px dashed var(--accent); outline-offset: 4px; }

  .num {
    font-family: 'Orbitron', sans-serif;
    font-size: .8rem;
    letter-spacing: .2em;
    color: var(--muted);
  }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 7vw, 5.2rem);
    line-height: 1;
    letter-spacing: .02em;
    color: transparent;
    -webkit-text-stroke: 1px rgba(236,233,255,.85);
  }
  .sub {
    display: block;
    margin-top: .8rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: .78rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--muted);
    -webkit-text-stroke: 0;
  }

  .work a:hover .title, .work a:focus-visible .title {
    color: var(--ink);
    -webkit-text-stroke-color: transparent;
    text-shadow: 0 0 22px var(--accent), 0 0 60px var(--accent-soft);
  }
  .work a:hover .num, .work a:focus-visible .num,
  .work a:hover .sub, .work a:focus-visible .sub { color: var(--accent); }

  @media (max-width: 700px) {
    main { padding: 8vh 16px; }
    .work a { grid-template-columns: 2.4rem 1fr; gap: 1rem; padding: 1.8rem 0; }
    .sub { letter-spacing: .18em; font-size: .68rem; }
  }
</style>
</head>
<body>
<main>
  <ol class="works">
    <li class="work" style="--accent: #ff2bd6; --accent-soft: rgba(255,43,214,.18)">
      <a href="0256.html">
        <span class="num">01</span>
        <span class="title">02:56<span class="sub">the night drive hour</span></span>
      </a>
    </li>
    <li class="work" style="--accent: #19f0ff; --accent-soft: rgba(25,240,255,.18)">
      <a href="exodus.html">
        <span class="num">02</span>
        <span class="title">EXODUS<span class="sub">year 2287 · departure log</span></span>
      </a>
    </li>
    <li class="work" style="--accent: #5fe39a; --accent-soft: rgba(95,227,154,.18)">
      <a href="specimen.html">
        <span class="num">03</span>
        <span class="title">SPECIMEN<span class="sub">a journal of living things</span></span>
      </a>
    </li>
  </ol>
</main>
</body>
</html>
